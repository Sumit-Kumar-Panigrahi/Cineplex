  </defs>
  <rect width="300" height="300" rx="16" fill="url(#bg_cb)"/>
  <circle cx="150" cy="150" r="110" fill="#e11d48" fill-opacity="0.1"/>
  
  <!-- Popcorn Tub (Left/Center) -->
  <polygon points="65,135 175,135 160,240 80,240" fill="url(#tub_cb)"/>
  <polygon points="85,135 98,135 94,240 85,240" fill="#ffffff" fill-opacity="0.9"/>
  <polygon points="112,135 125,135 122,240 114,240" fill="#ffffff" fill-opacity="0.9"/>
  <polygon points="140,135 152,135 146,240 138,240" fill="#ffffff" fill-opacity="0.9"/>
  <ellipse cx="120" cy="135" rx="55" ry="11" fill="#881337"/>
  
  <circle cx="85" cy="120" r="18" fill="url(#corn_cb)"/>
  <circle cx="110" cy="110" r="22" fill="url(#corn_cb)"/>
  <circle cx="135" cy="114" r="20" fill="url(#corn_cb)"/>
  <circle cx="155" cy="122" r="17" fill="url(#corn_cb)"/>
  <circle cx="100" cy="92" r="20" fill="url(#corn_cb)"/>
  <circle cx="128" cy="88" r="23" fill="url(#corn_cb)"/>
  
  <!-- Cold Drink Cup 1 (Right) -->
  <polygon points="190,130 240,130 230,240 198,240" fill="url(#coke_cb)"/>
  <ellipse cx="215" cy="130" rx="25" ry="7" fill="#f8fafc"/>
