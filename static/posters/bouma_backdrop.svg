<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bouma_bdbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#291503"/>
      <stop offset="50%" stop-color="#592705"/>
      <stop offset="100%" stop-color="#0f0801"/>
    </linearGradient>
    <radialGradient id="bouma_bdglow" cx="70%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bouma_darkoverlay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bouma_bdbg)"/>
  <circle cx="850" cy="280" r="380" fill="url(#bouma_bdglow)"/>

  <!-- Iconic Silhouette Elements on Right Side -->
  <circle cx="880" cy="270" r="140" fill="#000" fill-opacity="0.3" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="880" y="320" font-size="120" text-anchor="middle">🍲</text>

  <!-- Cinema Stage Lighting Effects -->
  <line x1="0" y1="0" x2="1280" y2="640" stroke="#fde68a" stroke-width="1.5" stroke-opacity="0.12"/>
  <line x1="1280" y1="0" x2="0" y2="640" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.08"/>

  <!-- Dark readable overlay across width -->
  <rect width="1280" height="640" fill="url(#bouma_darkoverlay)"/>

  <!-- Watermark Cinema Branding -->
  <text x="1200" y="70" fill="#f59e0b" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" letter-spacing="4" text-anchor="end" fill-opacity="0.6">CINEPLEX CINEMAS</text>
</svg>