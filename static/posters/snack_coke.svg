<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_k" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="can_c" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" rx="16" fill="url(#bg_k)"/>
  <circle cx="150" cy="150" r="110" fill="#ef4444" fill-opacity="0.1"/>
  
  <!-- Chilled Soda Can -->
  <rect x="110" y="90" width="80" height="150" rx="18" fill="url(#can_c)"/>
  <ellipse cx="150" cy="90" rx="40" ry="12" fill="#cbd5e1"/>
  <ellipse cx="150" cy="88" rx="35" ry="10" fill="#94a3b8"/>
  <ellipse cx="150" cy="240" rx="40" ry="12" fill="#991b1b"/>
  
  <!-- Can wave ribbon -->
  <path d="M 110,140 Q 150,180 190,140 L 190,165 Q 150,205 110,165 Z" fill="#ffffff" fill-opacity="0.9"/>
  
  <!-- Ice cubes around -->
  <rect x="80" y="215" width="28" height="28" rx="4" fill="#93c5fd" fill-opacity="0.6" stroke="#bfdbfe" transform="rotate(15 94 229)"/>
  <rect x="195" y="210" width="26" height="26" rx="4" fill="#93c5fd" fill-opacity="0.6" stroke="#bfdbfe" transform="rotate(-20 208 223)"/>
  
  <text x="150" y="278" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">CHILLED BEVERAGE</text>
</svg>