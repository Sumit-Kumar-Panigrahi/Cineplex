<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="pushpa2_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0505"/>
      <stop offset="50%" stop-color="#5c0e0e"/>
      <stop offset="100%" stop-color="#120202"/>
    </linearGradient>
    <radialGradient id="pushpa2_glow" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#ef4444" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="600" fill="url(#pushpa2_grad)"/>
  <circle cx="200" cy="210" r="160" fill="url(#pushpa2_glow)"/>

  <!-- Top Cinema Badges -->
  <rect x="25" y="26" width="130" height="26" rx="5" fill="#000" stroke="#ef4444" stroke-width="1.2"/>
  <text x="90" y="44" fill="#ef4444" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">ACTION • CRIME THRILLER</text>

  <rect x="305" y="26" width="70" height="26" rx="5" fill="#000" stroke="#f87171" stroke-width="1.2"/>
  <text x="340" y="44" fill="#f87171" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle">★ 9.1</text>

  <!-- Center Emblem -->
  <circle cx="200" cy="210" r="75" fill="#000" fill-opacity="0.4" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="200" y="235" font-size="64" text-anchor="middle">🪓</text>

  <!-- Bottom Title & Meta -->
  <text x="200" y="415" fill="#ef4444" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="3" text-anchor="middle">THE RULE • WILDFIRE INTENSIFIES</text>
  <text x="200" y="470" fill="#ffffff" font-family="'Arial Black', Impact, sans-serif" font-size="40" font-weight="900" letter-spacing="2" text-anchor="middle">PUSHPA 2</text>
  <text x="200" y="508" fill="#f87171" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle">UA 16+ • 195 MINS • HINDI, TELUGU</text>
  <text x="200" y="540" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">ALLU ARJUN • RASHMIKA • FAHADH FAASIL</text>

  <rect x="140" y="560" width="120" height="22" rx="4" fill="#ffffff" fill-opacity="0.12"/>
  <text x="200" y="575" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">CINEPLEX PASS</text>
</svg>